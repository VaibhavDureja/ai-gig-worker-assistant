name: Build free Android prototype

on:
  push:
    branches: ["main", "parkcast-prototype"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Check hosted Android SDK
        run: |\n          SDKMGR=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)\n          test -x "$SDKMGR"\n          echo "SDKMGR=$SDKMGR" >> "$GITHUB_ENV"\n          echo "Android SDK manager: $SDKMGR"
      - name: Install Android SDK platform
        run: "$SDKMGR" --install "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Test token security
        run: gradle --no-daemon :app:testDebugUnitTest
      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ParkCast-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
